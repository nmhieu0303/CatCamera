name: AI PR Review

on:
  workflow_run:
    workflows: [PR Review]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-pr-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  ai-review:
    name: Advisory AI review
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.repository.full_name == github.repository &&
        github.event.workflow_run.pull_requests[0].head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # This checks out the default branch, never the PR head. The reviewer reads
      # the PR diff through the GitHub API and never executes PR source code.
      - name: Checkout trusted reviewer code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install reviewer dependencies
        run: npm ci --ignore-scripts

      - name: Run advisory AI review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || secrets.OPENAI_MODEL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: node scripts/ai-review/index.mjs
